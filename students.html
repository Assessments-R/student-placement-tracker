<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="topbar">
        <div>
            <h1>Student Management</h1>
            <p id="welcomeMessage">Loading...</p>
        </div>

        <button type="button" id="logoutButton">Logout</button>
    </header>

    <nav class="main-navigation">
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="students.html">Students</a>
        <a href="drives.html">Placement Drives</a>
        <a href="reports.html">Reports</a>
        <a href="academics.html">Academic & Backlogs</a>
    </nav>

    <main class="content-container">
        <section class="panel">
            <h2 id="formTitle">Add Student</h2>

            <form id="studentForm">
                <input type="hidden" id="studentRecordId">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="universityId">University ID *</label>
                        <input type="text" id="universityId" required>
                    </div>

                    <div class="form-group">
                        <label for="studentName">Student Name *</label>
                        <input type="text" id="studentName" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="form-group">
                        <label for="mobileNumber">Mobile Number</label>
                        <input
                            type="tel"
                            id="mobileNumber"
                            maxlength="15"
                        >
                    </div>

                    <div class="form-group">
                        <label for="branch">Branch *</label>
                        <select id="branch" required>
                            <option value="">Select branch</option>
                            <option value="CSE">CSE</option>
                            <option value="CSE-AI">CSE – AI</option>
                            <option value="CSE-DS">CSE – Data Science</option>
                            <option value="CSE-CS">CSE – Cyber Security</option>
                            <option value="ECE">ECE</option>
                            <option value="EEE">EEE</option>
                            <option value="Mechanical">Mechanical</option>
                            <option value="Civil">Civil</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="batch">Batch *</label>
                        <input
                            type="text"
                            id="batch"
                            placeholder="Example: 2023-2027"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="section">Section</label>
                        <input type="text" id="section">
                    </div>

                    <div class="form-group">
                        <label for="tenthPercentage">10th Percentage</label>
                        <input
                            type="number"
                            id="tenthPercentage"
                            min="0"
                            max="100"
                            step="0.01"
                        >
                    </div>

                    <div class="form-group">
                        <label for="interPercentage">
                            Intermediate Percentage
                        </label>
                        <input
                            type="number"
                            id="interPercentage"
                            min="0"
                            max="100"
                            step="0.01"
                        >
                    </div>

                    <div class="form-group">
                        <label for="diplomaPercentage">
                            Diploma Percentage
                        </label>
                        <input
                            type="number"
                            id="diplomaPercentage"
                            min="0"
                            max="100"
                            step="0.01"
                        >
                    </div>

                    <div class="form-group">
                        <label for="currentSemester">
                            Current Semester
                        </label>
                        <select id="currentSemester">
                            <option value="">Select semester</option>
                            <option value="1">Semester 1</option>
                            <option value="2">Semester 2</option>
                            <option value="3">Semester 3</option>
                            <option value="4">Semester 4</option>
                            <option value="5">Semester 5</option>
                            <option value="6">Semester 6</option>
                            <option value="7">Semester 7</option>
                            <option value="8">Semester 8</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="btechCgpa">Current B.Tech CGPA</label>
                        <input
                            type="number"
                            id="btechCgpa"
                            min="0"
                            max="10"
                            step="0.01"
                        >
                    </div>

                    <div class="form-group">
                        <label for="activeBacklogs">Active Backlogs</label>
                        <input
                            type="number"
                            id="activeBacklogs"
                            min="0"
                            value="0"
                        >
                    </div>

                    <div class="form-group">
                        <label for="placementStatus">Placement Status</label>
                        <select id="placementStatus">
                            <option value="Not Placed">Not Placed</option>
                            <option value="Placed">Placed</option>
                            <option value="Multiple Offers">
                                Multiple Offers
                            </option>
                            <option value="Higher Studies">
                                Higher Studies
                            </option>
                            <option value="Not Interested">
                                Not Interested
                            </option>
                        </select>
                    </div>
                </div>

                <div class="quick-actions" style="margin-top: 20px;">
                    <button type="submit" id="saveStudentButton">
                        Save Student
                    </button>

                    <button
                        type="button"
                        id="cancelEditButton"
                        hidden
                    >
                        Cancel Edit
                    </button>
                </div>

                <p id="formMessage" class="status-message"></p>
            </form>
        </section>

        <section class="panel">
            <h2>Student Records</h2>

            <input
                type="search"
                id="studentSearch"
                class="search-input"
                placeholder="Search by name, University ID, email or branch"
            >

            <p id="studentCount" class="status-message"></p>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>University ID</th>
                            <th>Name</th>
                            <th>Branch</th>
                            <th>Batch</th>
                            <th>Email</th>
                            <th>Mobile</th>
                            <th>CGPA</th>
                            <th>Backlogs</th>
                            <th>Placement Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="studentTableBody">
                        <tr>
                            <td colspan="10">Loading student records...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/students.js"></script>
</body>
</html>
