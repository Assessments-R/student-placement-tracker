<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Tracker Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="topbar">
        <div>
            <h1>Student Placement Tracker</h1>
            <p id="welcomeMessage">Loading...</p>
        </div>

        <button type="button" id="logoutButton">Logout</button>
    </header>

    <nav class="main-navigation">
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="students.html">Students</a>
        <a href="drives.html">Placement Drives</a>
        <a href="reports.html">Reports</a>
    </nav>

    <main class="dashboard-container">
        <h2>Placement Overview</h2>

        <p id="dashboardMessage"></p>

        <section class="dashboard-cards">
            <article class="dashboard-card">
                <h3>Total Students</h3>
                <p id="totalStudents">—</p>
            </article>

            <article class="dashboard-card">
                <h3>Placed Students</h3>
                <p id="placedStudents">—</p>
            </article>

            <article class="dashboard-card">
                <h3>Placement Offers</h3>
                <p id="totalOffers">—</p>
            </article>

            <article class="dashboard-card">
                <h3>Upcoming Drives</h3>
                <p id="upcomingDrives">—</p>
            </article>
        </section>

        <section class="quick-actions">
            <h2>Quick Actions</h2>

            <div>
                <a class="action-button" href="students.html">
                    Add or Manage Students
                </a>

                <a class="action-button" href="drives.html">
                    Manage Placement Drives
                </a>

                <a class="action-button" href="reports.html">
                    View Reports
                </a>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/admin-dashboard.js"></script>
</body>
</html>
