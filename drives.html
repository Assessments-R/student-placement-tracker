<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Drives</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="topbar">
        <div>
            <h1>Placement Drives</h1>
            <p id="welcomeMessage">Loading...</p>
        </div>

        <button type="button" id="logoutButton">Logout</button>
    </header>

    <nav class="main-navigation">
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="students.html">Students</a>
        <a href="drives.html">Placement Drives</a>
        <a href="reports.html">Reports</a>
    </nav>

    <main class="content-container">
        <section class="panel">
            <h2 id="formTitle">Create Placement Drive</h2>

            <form id="driveForm">
                <input type="hidden" id="driveRecordId">
                <input type="hidden" id="companyRecordId">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="companyName">Company Name *</label>
                        <input type="text" id="companyName" required>
                    </div>

                    <div class="form-group">
                        <label for="driveName">Drive Name *</label>
                        <input
                            type="text"
                            id="driveName"
                            placeholder="Example: Campus Hiring 2027"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="jobRole">Job Role *</label>
                        <input type="text" id="jobRole" required>
                    </div>

                    <div class="form-group">
                        <label for="jobLocation">Job Location</label>
                        <input type="text" id="jobLocation">
                    </div>

                    <div class="form-group">
                        <label for="packageLpa">Package (LPA)</label>
                        <input
                            type="number"
                            id="packageLpa"
                            min="0"
                            step="0.01"
                        >
                    </div>

                    <div class="form-group">
                        <label for="driveDate">Drive Date</label>
                        <input type="date" id="driveDate">
                    </div>

                    <div class="form-group">
                        <label for="registrationDeadline">
                            Registration Deadline
                        </label>
                        <input
                            type="datetime-local"
                            id="registrationDeadline"
                        >
                    </div>

                    <div class="form-group">
                        <label for="minimumTenth">
                            Minimum 10th Percentage
                        </label>
                        <input
                            type="number"
                            id="minimumTenth"
                            min="0"
                            max="100"
                            step="0.01"
                        >
                    </div>

                    <div class="form-group">
                        <label for="minimumInter">
                            Minimum Intermediate Percentage
                        </label>
                        <input
                            type="number"
                            id="minimumInter"
                            min="0"
                            max="100"
                            step="0.01"
                        >
                    </div>

                    <div class="form-group">
                        <label for="minimumCgpa">
                            Minimum B.Tech CGPA
                        </label>
                        <input
                            type="number"
                            id="minimumCgpa"
                            min="0"
                            max="10"
                            step="0.01"
                        >
                    </div>

                    <div class="form-group">
                        <label for="maximumBacklogs">
                            Maximum Active Backlogs
                        </label>
                        <input
                            type="number"
                            id="maximumBacklogs"
                            min="0"
                            value="0"
                        >
                    </div>

                    <div class="form-group">
                        <label for="eligibleBranches">
                            Eligible Branches
                        </label>
                        <input
                            type="text"
                            id="eligibleBranches"
                            placeholder="CSE, ECE, EEE"
                        >
                    </div>

                    <div class="form-group">
                        <label for="driveMode">Drive Mode</label>
                        <select id="driveMode">
                            <option value="On Campus">On Campus</option>
                            <option value="Off Campus">Off Campus</option>
                            <option value="Virtual">Virtual</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="driveStatus">Drive Status</label>
                        <select id="driveStatus">
                            <option value="Draft">Draft</option>
                            <option value="Upcoming">Upcoming</option>
                            <option value="Registration Open">
                                Registration Open
                            </option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="employmentType">
                            Employment Type
                        </label>
                        <select id="employmentType">
                            <option value="Full Time">Full Time</option>
                            <option value="Internship">Internship</option>
                            <option value="Internship + Full Time">
                                Internship + Full Time
                            </option>
                            <option value="Contract">Contract</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 18px;">
                    <label for="driveDescription">Description</label>
                    <textarea
                        id="driveDescription"
                        rows="4"
                    ></textarea>
                </div>

                <div class="quick-actions" style="margin-top: 20px;">
                    <button type="submit" id="saveDriveButton">
                        Save Drive
                    </button>

                    <button
                        type="button"
                        id="cancelDriveEditButton"
                        hidden
                    >
                        Cancel Edit
                    </button>
                </div>

                <p id="driveFormMessage" class="status-message"></p>
            </form>
        </section>

        <section class="panel">
            <h2>Placement Drive Records</h2>

            <input
                type="search"
                id="driveSearch"
                class="search-input"
                placeholder="Search by company, drive, role or status"
            >

            <p id="driveCount" class="status-message"></p>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Company</th>
                            <th>Drive</th>
                            <th>Role</th>
                            <th>Package</th>
                            <th>Date</th>
                            <th>Mode</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="driveTableBody">
                        <tr>
                            <td colspan="8">
                                Loading placement drives...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/drives.js"></script>
</body>
</html>
